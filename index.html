<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libirny Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: radial-gradient(circle at 20% 0%, #2a0a3a 0%, #0d0d14 55%);
    color: #f2f2f7; min-height: 100vh; padding-bottom: 120px;
  }
  header {
    padding: 25px 16px 18px;
    background: linear-gradient(135deg, #7b2ff7 0%, #f107a3 100%);
    border-radius: 0 0 28px 28px;
    box-shadow: 0 8px 30px rgba(123, 47, 247, .45);
  }
  header h1 { font-size: 24px; letter-spacing: 1px; }
  header p  { opacity: .85; font-size: 13px; margin-top: 4px; }
  .section-title {
    margin: 22px 16px 12px; font-size: 15px; color: #b9a7ff;
    text-transform: uppercase; letter-spacing: 2px;
  }
  .grid { padding: 0 16px; display: grid; gap: 12px; }
  .card {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 18px; padding: 14px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(8px);
    transition: transform .15s ease;
  }
  .card:active { transform: scale(.97); }
  .thumb {
    width: 58px; height: 58px; border-radius: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 28px;
  }
  .t1 { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
  .t2 { background: linear-gradient(135deg, #f7971e, #ffd200); }
  .t3 { background: linear-gradient(135deg, #56ab2f, #a8e063); }
  .t4 { background: linear-gradient(135deg, #ff512f, #dd2476); }
  .info { flex: 1; }
  .info .name { font-size: 15px; font-weight: 600; }
  .info .price { font-size: 13px; color: #ffd200; margin-top: 3px; }
  .qty-ctrl { display: flex; align-items: center; gap: 10px; }
  .qty-ctrl button {
    width: 32px; height: 32px; border-radius: 10px; border: none;
    background: rgba(255,255,255,.12); color: #fff; font-size: 18px; cursor: pointer;
  }
  .qty-ctrl .num { min-width: 18px; text-align: center; font-weight: 700; }
  .bar {
    position: fixed; left: 12px; right: 12px; bottom: 12px;
    background: rgba(30, 20, 50, .92);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 20px; padding: 14px;
    backdrop-filter: blur(12px);
    box-shadow: 0 -4px 30px rgba(0,0,0,.5);
  }
  .bar .row { display: flex; justify-content: space-between; font-size: 13px; color: #cfc9e8; }
  .bar .row b { color: #fff; }
  input {
    width: 100%; padding: 12px; margin: 10px 0;
    border-radius: 12px; border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.08); color: #fff; font-size: 15px; outline: none;
  }
  input::placeholder { color: #8d86a8; }
  .order-btn {
    width: 100%; padding: 14px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #7b2ff7, #f107a3);
    color: #fff; font-size: 16px; font-weight: 700; letter-spacing: .5px; cursor: pointer;
    box-shadow: 0 6px 20px rgba(241, 7, 163, .4);
  }
  .order-btn:active { transform: scale(.98); }
  .empty { color: #8d86a8; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>💨 LIBIRNY SHOP</h1>
  <p>Жидкости для вашего вейпа — только 18+</p>
</header>

<div class="section-title">Каталог</div>
<div class="grid" id="list"></div>

<div class="bar">
  <div class="row"><span>Корзина</span><b id="total">0 ₽</b></div>
  <input type="text" id="phone" placeholder="📞 Ваш телефон">
  <button class="order-btn" onclick="sendOrder()">ОФОРМИТЬ ЗАКАЗ</button>
</div>

<script>
const ITEMS = [
  {code:"liq1", name:"Арбуз-лёд",       vol:"30 мл", price:500, cls:"t1", emoji:"🍉"},
  {code:"liq2", name:"Манго-маракуйя",  vol:"30 мл", price:550, cls:"t2", emoji:"🥭"},
  {code:"liq3", name:"Виноград-мята",   vol:"30 мл", price:550, cls:"t3", emoji:"🍇"},
  {code:"liq4", name:"Клубника-банан",  vol:"30 мл", price:500, cls:"t4", emoji:"🍓"}
];
let cart = {};
Telegram.WebApp.expand();

function render() {
  document.getElementById("list").innerHTML = ITEMS.map(i => `
    <div class="card">
      <div class="thumb ${i.cls}">${i.emoji}</div>
      <div class="info">
        <div class="name">${i.name}</div>
        <div class="price">${i.vol} — ${i.price} ₽</div>
      </div>
      <div class="qty-ctrl">
        <button onclick="dec('${i.code}')">−</button>
        <span class="num">${cart[i.code] || 0}</span>
        <button onclick="inc('${i.code}')">+</button>
      </div>
    </div>`).join("");

  let total = 0;
  for (const [code, qty] of Object.entries(cart)) {
    const i = ITEMS.find(x => x.code === code);
    if (i) total += i.price * qty;
  }
  document.getElementById("total").textContent = total + " ₽";
}

function inc(code) { cart[code] = (cart[code] || 0) + 1; render(); }
function dec(code) { if (cart[code]) { cart[code]--; render(); } }

function sendOrder() {
  const entries = Object.entries(cart).filter(([c, q]) => q > 0);
  if (!entries.length) { alert("Корзина пуста!"); return; }
  const phone = document.getElementById("phone").value.trim();
  if (!phone) { alert("Введите телефон!"); return; }

  let total = 0;
  const items = entries.map(([code, qty]) => {
    const i = ITEMS.find(x => x.code === code);
    total += i.price * qty;
    return {name: i.name + " " + i.vol, qty: qty, price: i.price};
  });

  Telegram.WebApp.sendData(JSON.stringify({items: items, total: total, phone: phone}));
}

render();
</script>
</body>
</html>
