<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Libirny Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --bg:#0b0b10; --card:#16161f; --card2:#1e1e2b;
    --line:#26263a; --txt:#f5f5fa; --mut:#8a8fa8;
    --acc:#00e676; --acc2:#00b0ff;
  }
  body { font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  .page { display:none; padding-bottom:90px; min-height:100vh; }
  .page.active { display:block; }

  /* ── Шапка ── */
  .top {
    padding:22px 16px 16px;
    background:linear-gradient(160deg,#141428 0%,#0b0b10 90%);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:5;
  }
  .top h1 { font-size:22px; font-weight:800; letter-spacing:.5px; }
  .top h1 em { font-style:normal; color:var(--acc); }
  .top .sub { color:var(--mut); font-size:12px; margin-top:3px; }
  .warn {
    display:none; margin:10px 16px 0; padding:10px 14px;
    background:#3a1a1a; border:1px solid #5c2a2a; border-radius:12px;
    color:#ffb4b4; font-size:13px;
  }

  /* ── Категории ── */
  .chips { display:flex; gap:8px; padding:14px 16px 4px; overflow-x:auto; }
  .chip {
    padding:8px 16px; border-radius:20px; font-size:13px; white-space:nowrap;
    background:var(--card); color:var(--mut); border:1px solid var(--line); cursor:pointer;
  }
  .chip.on { background:var(--acc); color:#04150a; font-weight:700; border-color:var(--acc); }

  /* ── Карточки товаров ── */
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:12px 16px; }
  .pcard {
    background:var(--card); border:1px solid var(--line);
    border-radius:16px; overflow:hidden;
  }
  .pimg {
    height:120px; display:flex; align-items:center; justify-content:center;
    font-size:44px;
  }
  .pimg img { width:100%; height:100%; object-fit:cover; }
  .pbody { padding:10px 12px 12px; }
  .pname { font-size:13.5px; font-weight:600; line-height:1.3; min-height:36px; }
  .pmeta { color:var(--mut); font-size:11px; margin-top:2px; }
  .prow { display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
  .pprice { font-weight:800; font-size:14px; color:var(--acc); }
  .add {
    width:30px; height:30px; border:none; border-radius:9px;
    background:var(--acc); color:#04150a; font-size:18px; font-weight:800; cursor:pointer;
  }
  .cnt {
    position:absolute; transform:translate(14px,-6px);
    background:var(--acc2); color:#fff; font-size:10px; font-weight:800;
    min-width:18px; height:18px; border-radius:9px;
    display:flex; align-items:center; justify-content:center; padding:0 5px;
  }

  /* ── Нижняя навигация ── */
  .nav {
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    display:flex; background:var(--card); border-top:1px solid var(--line);
  }
  .nav div {
    flex:1; text-align:center; padding:12px 0 16px;
    color:var(--mut); font-size:12px; cursor:pointer; position:relative;
  }
  .nav div .ic { font-size:20px; display:block; margin-bottom:2px; }
  .nav div.on { color:var(--acc); }
  .nav .badge {
    position:absolute; top:4px; left:calc(50% + 6px);
    background:#f44; color:#fff; font-size:10px; font-weight:800;
    min-width:17px; height:17px; border-radius:9px;
    display:flex; align-items:center; justify-content:center; padding:0 4px;
  }

  /* ── Корзина ── */
  .wrap { padding:20px 16px; }
  .crow {
    display:flex; align-items:center; gap:12px;
    background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:12px; margin-bottom:10px;
  }
  .crow .e { font-size:26px; }
  .crow .m { flex:1; }
  .crow .m b { font-size:13.5px; display:block; }
  .crow .m small { color:var(--mut); }
  .step { display:flex; align-items:center; gap:8px; }
  .step button {
    width:28px; height:28px; border-radius:8px; border:none;
    background:var(--card2); color:var(--txt); font-size:16px; cursor:pointer;
  }
  .sumbox {
    margin-top:14px; padding:16px; background:var(--card);
    border:1px solid var(--line); border-radius:16px;
  }
  .sumbox .r { display:flex; justify-content:space-between; margin-bottom:8px; font-size:14px; color:var(--mut); }
  .sumbox .r b { color:var(--txt); }
  .sumbox .r.total b { color:var(--acc); font-size:17px; }
  input, select {
    width:100%; padding:13px; margin-bottom:10px;
    border-radius:12px; border:1px solid var(--line);
    background:var(--card2); color:var(--txt); font-size:15px; outline:none;
  }
  .cta {
    width:100%; padding:15px; border:none; border-radius:14px;
    background:linear-gradient(90deg,var(--acc),var(--acc2));
    color:#04150a; font-weight:800; font-size:16px; cursor:pointer; margin-top:6px;
  }
  .ghost { color:var(--mut); text-align:center; padding:40px 0; font-size:14px; }
  .empty-e { font-size:52px; text-align:center; padding-top:60px; }
</style>
</head>
<body>

<div class="page active" id="page-cat">
  <div class="top">
    <h1>LIBIRNY <em>VAPE</em> STORE</h1>
    <div class="sub">Жидкости 30 мл · доставка по городу · 18+</div>
  </div>
  <div class="warn" id="warn">⚠️ Открой магазин через кнопку бота «Открыть магазин» — иначе заказ не отправится.</div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="list"></div>
</div>

<div class="page" id="page-cart">
  <div class="top"><h1>🛒 Корзина</h1></div>
  <div class="wrap" id="cart-body"></div>
</div>

<div class="nav">
  <div class="on" onclick="go('cat')"><span class="ic">🏠</span>Каталог</div>
  <div onclick="go('cart')"><span class="ic">🛒</span>Корзина<span class="badge" id="navbadge" style="display:none">0</span></div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (!tg) {
  document.getElementById('warn').style.display = 'block';
} else {
  tg.ready(); tg.expand();
  if (tg.setHeaderColor) tg.setHeaderColor('#141428');
}

const ITEMS = [
  {code:"l1", name:"Арбуз-лёд",        cat:"fruit", vol:"30 мл", price:500, e:"🍉", img:""},
  {code:"l2", name:"Манго-маракуйя",   cat:"fruit", vol:"30 мл", price:550, e:"🥭", img:""},
  {code:"l3", name:"Виноград-мята",    cat:"fresh", vol:"30 мл", price:550, e:"🍇", img:""},
  {code:"l4", name:"Клубника-банан",   cat:"fruit", vol:"30 мл", price:500, e:"🍓", img:""},
  {code:"l5", name:"Ледяная мята",     cat:"fresh", vol:"30 мл", price:450, e:"❄️", img:""},
  {code:"l6", name:"Двойное яблоко",   cat:"fruit", vol:"30 мл", price:500, e:"🍏", img:""}
];
const CATS = [
  {id:"all", name:"🔥 Всё"},
  {id:"fruit", name:"🍉 Фруктовые"},
  {id:"fresh", name:"❄️ Свежие"}
];
let cart = {}, curCat = "all";

const grad = ["linear-gradient(135deg,#ff416c,#ff4b2b)","linear-gradient(135deg,#f7971e,#ffd200)",
              "linear-gradient(135deg,#11998e,#38ef7d)","linear-gradient(135deg,#fc466b,#3f5efb)",
              "linear-gradient(135deg,#00c6fb,#005bea)","linear-gradient(135deg,#7f00ff,#e100ff)"];

function renderChips(){
  document.getElementById('chips').innerHTML = CATS.map(c =>
    `<div class="chip ${c.id===curCat?'on':''}" onclick="setCat('${c.id}')">${c.name}</div>`).join('');
}
function setCat(id){ curCat = id; renderChips(); renderList(); }

function renderList(){
  const list = ITEMS.filter(i => curCat==="all" || i.cat===curCat);
  document.getElementById('list').innerHTML = list.map((i,n) => {
    const cnt = cart[i.code]||0;
    const img = i.img
      ? `<img src="${i.img}" alt="">`
      : `<div style="width:100%;height:100%;background:${grad[n%grad.length]};display:flex;align-items:center;justify-content:center;font-size:44px">${i.e}</div>`;
    return `<div class="pcard" style="position:relative">
      <div class="pimg">${img}</div>
      ${cnt>0?`<div class="cnt">${cnt}</div>`:''}
      <div class="pbody">
        <div class="pname">${i.name}</div>
        <div class="pmeta">${i.vol}</div>
        <div class="prow">
          <div class="pprice">${i.price} ₽</div>
          <button class="add" onclick="inc('${i.code}')">+</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function countCart(){ return Object.values(cart).reduce((s,q)=>s+q,0); }
function totalSum(){ return Object.entries(cart).reduce((s,[c,q])=>{ const i=ITEMS.find(x=>x.code===c); return s+(i?i.price*q:0); },0); }

function renderNav(){
  const n = countCart(), b = document.getElementById('navbadge');
  b.style.display = n ? 'flex' : 'none';
  b.textContent = n;
}

function go(p){
  document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  document.querySelectorAll('.nav div').forEach((e,i)=>e.classList.toggle('on', (p==='cat'&&i===0)||(p==='cart'&&i===1)));
  if (p==='cart') renderCart();
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
}

function renderCart(){
  const entries = Object.entries(cart).filter(([c,q])=>q>0);
  if (!entries.length){
    document.getElementById('cart-body').innerHTML =
      `<div class="empty-e">🫙</div><div class="ghost">Корзина пуста<br>Загляни в каталог!</div>`;
    return;
  }
  let rows = entries.map(([c,q])=>{
    const i = ITEMS.find(x=>x.code===c);
    return `<div class="crow">
      <div class="e">${i.e}</div>
      <div class="m"><b>${i.name}</b><small>${i.vol} · ${i.price} ₽</small></div>
      <div class="step">
        <button onclick="dec('${c}')">−</button>
        <span>${q}</span>
        <button onclick="inc('${c}')">+</button>
      </div>
    </div>`;
  }).join('');
  const t = totalSum();
  document.getElementById('cart-body').innerHTML = rows + `
    <div class="sumbox">
      <div class="r"><span>Товаров</span><b>${countCart()} шт.</b></div>
      <div class="r total"><span>Итого</span><b>${t} ₽</b></div>
      <input type="text" id="name" placeholder="Твоё имя">
      <input type="tel" id="phone" placeholder="Телефон для связи">
      <select id="delivery">
        <option value="pickup">📦 Самовывоз</option>
        <option value="courier">🚚 Доставка курьером</option>
      </select>
      <button class="cta" onclick="sendOrder()">ОФОРМИТЬ ЗАКАЗ · ${t} ₽</button>
    </div>`;
}

function inc(c){ cart[c]=(cart[c]||0)+1; renderList(); renderNav(); if(document.getElementById('page-cart').classList.contains('active')) renderCart(); }
function dec(c){ if(cart[c]){ cart[c]--; renderList(); renderNav(); if(document.getElementById('page-cart').classList.contains('active')) renderCart(); } }

function sendOrder(){
  if (!tg){ alert('Открой магазин через кнопку в боте!'); return; }
  const entries = Object.entries(cart).filter(([c,q])=>q>0);
  if (!entries.length){ alert('Корзина пуста!'); return; }
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  if (!phone){ alert('Введи телефон!'); return; }
  const delivery = document.getElementById('delivery').value;
  const order = {
    items: entries.map(([c,q])=>{ const i=ITEMS.find(x=>x.code===c); return {name:i.name+" "+i.vol, qty:q, price:i.price}; }),
    total: totalSum(),
    name: name || "—",
    phone: phone,
    delivery: delivery === "courier" ? "Доставка" : "Самовывоз"
  };
  try {
    tg.sendData(JSON.stringify(order));
  } catch(e) {
    alert('Не удалось отправить заказ: ' + e.message);
  }
}

renderChips(); renderList(); renderNav();
</script>
</body>
</html>
