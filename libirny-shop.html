<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Libirny Shop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-dark: #0b0b10;
      --glass: rgba(22, 22, 31, 0.75);
      --glass-strong: rgba(16, 16, 24, 0.92);
      --accent: #00e676;
      --accent-glow: rgba(0, 230, 118, 0.4);
      --text: #f5f5fa;
      --muted: #a0a5b0;
      --border: rgba(255, 255, 255, 0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      overflow: hidden;
      position: relative;
    }

    /* Фоновые эффекты */
    .bg-gradient {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 1;
      background: radial-gradient(circle at 50% 20%, rgba(0, 230, 118, 0.12) 0%, rgba(10, 10, 20, 1) 70%);
      animation: pulse-gradient 12s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes pulse-gradient {
      0% { opacity: 0.8; }
      100% { opacity: 1.0; }
    }

    .particles {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
      overflow: hidden; pointer-events: none;
    }
    .particle {
      position: absolute; top: -20px; width: 6px; height: 6px;
      border-radius: 50%; background: rgba(255,255,255,0.15);
      opacity: 0; animation: float 8s infinite linear;
    }
    @keyframes float {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      20% { opacity: 0.3; }
      80% { opacity: 0.2; }
      100% { transform: translateY(-100vh) scale(0.6); opacity: 0; }
    }

    /* Страницы */
    .page {
      display: none; padding-bottom: 90px; min-height: 100vh;
      position: relative; z-index: 3;
    }
    .page.active { display: block; }

    /* Шапка (iOS style) */
    .top {
      padding: 20px 16px 14px;
      background: var(--glass-strong);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .top h1 {
      font-size: 20px; font-weight: 700; letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .top h1 em {
      color: var(--accent); text-shadow: 0 0 10px var(--accent-glow);
    }
    .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }

    .warn {
      margin: 12px 16px; padding: 10px 14px;
      background: rgba(58, 26, 26, 0.9);
      border: 1px solid rgba(92, 42, 42, 0.6);
      border-radius: 16px; color: #ffb4b4;
      font-size: 13px; display: none;
    }

    /* Категории (чипы) */
    .chips {
      display: flex; gap: 10px; padding: 14px 16px 6px;
      overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      padding: 10px 18px; border-radius: 24px;
      font-size: 13px; white-space: nowrap;
      background: rgba(255,255,255,0.04);
      color: var(--muted); border: 1px solid var(--border);
      cursor: pointer; transition: all 0.25s ease;
    }
    .chip.on {
      background: var(--accent); color: #04150a;
      box-shadow: 0 4px 12px rgba(0,230,118,0.35);
    }

    /* Сетка товаров */
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(152px, 1fr));
      gap: 12px; padding: 12px 16px;
    }
    .pcard {
      background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border); border-radius: 18px;
      overflow: hidden; position: relative; transition: transform 0.2s, box-shadow 0.2s;
    }
    .pcard:active { transform: scale(0.97); }
    .pimg { height: 136px; overflow: hidden; }
    .pimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pbody { padding: 12px; }
    .pname { font-size: 14px; font-weight: 600; line-height: 1.3; color: var(--text); }
    .prow { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    .pprice { font-weight: 700; font-size: 15px; color: var(--accent); }
    .add {
      width: 32px; height: 32px; border: none; border-radius: 12px;
      background: rgba(255,255,255,0.1); color: var(--text);
      font-size: 18px; cursor: pointer;
    }
    .add:active { background: rgba(255,255,255,0.2); }
    .cnt {
      position: absolute; top: 8px; left: 8px; background: rgba(0, 230, 118, 0.95);
      color: #04150a; font-size: 11px; font-weight: 700; min-width: 22px; height: 22px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      padding: 0 6px; pointer-events: none;
    }

    /* Навигация (снизу) */
    .nav {
      position: fixed; left: 0; right: 0; bottom: 0; display: flex;
      background: var(--glass-strong); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid var(--border); z-index: 10;
    }
    .nav div {
      flex: 1; text-align: center; padding: 14px 0 18px; color: var(--muted);
      font-size: 12px; cursor: pointer; position: relative;
    }
    .nav .ic { font-size: 20px; display: block; margin-bottom: 4px; }
    .nav div.on { color: var(--accent); }
    .badge {
      position: absolute; top: 4px; left: calc(50% + 6px); background: #ff3b30; color: white;
      font-size: 10px; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center; padding: 0 5px;
    }

    /* Корзина */
    .wrap { padding: 16px; }
    .crow {
      display: flex; align-items: center; gap: 12px; background: var(--glass);
      border: 1px solid var(--border); border-radius: 16px; padding: 12px; margin-bottom: 10px;
    }
    .crow img { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; }
    .crow .m { flex: 1; }
    .crow .m b { font-size: 14px; display: block; color: var(--text); }
    .crow .m small { color: var(--muted); }
    .step { display: flex; align-items: center; gap: 8px; }
    .step button {
      width: 30px; height: 30px; border-radius: 10px; border: none;
      background: rgba(255,255,255,0.06); color: var(--text); font-size: 18px; cursor: pointer;
    }
    .sumbox {
      margin-top: 16px; padding: 16px; background: var(--glass-strong);
      border: 1px solid var(--border); border-radius: 16px;
    }
    .r { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: var(--muted); }
    .r.total b { color: var(--accent); font-size: 17px; }
    input, select {
      width: 100%; padding: 14px; margin-bottom: 10px; border-radius: 14px;
      border: 1px solid var(--border); background: rgba(0,0,0,0.3); color: var(--text);
      font-size: 15px; outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
    .cta {
      width: 100%; padding: 16px; border: none; border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), #00b0ff);
      color: #04150a; font-weight: 700; font-size: 16px; cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 230, 118, 0.25);
    }
    .ghost {
      text-align: center; padding: 40px 0; font-size: 14px; color: var(--muted);
    }
  </style>
</head>
<body>

  <!-- Фоновые эффекты -->
  <div class="bg-gradient"></div>
  <div class="particles" id="particles"></div>

  <div class="page active" id="page-cat">
    <div class="top">
      <h1>LIBIRNY <em>SHOP</em></h1>
      <div class="sub">Только 18+ · Заказы через бота</div>
    </div>
    <div class="warn" id="warn">⚠️ Открой магазин через кнопку бота, иначе заказ не отправится.</div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="list"></div>
  </div>

  <div class="page" id="page-cart">
    <div class="top"><h1>🛒 Корзина</h1></div>
    <div class="wrap" id="cart-body"></div>
  </div>

  <div class="nav">
    <div class="on" onclick="go('cat')"><span class="ic">🏠</span>Каталог</div>
    <div onclick="go('cart')"><span class="ic">🛒</span>Корзина<span class="badge" id="badge" style="display:none">0</span></div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (!tg) { document.getElementById('warn').style.display = 'block'; }
    else { tg.ready(); tg.expand(); }

    // Лёгкие частицы на фоне
    const particles = document.getElementById('particles');
    for (let i = 0; i < 35; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (Math.random() * 6 + 4) + 's';
      p.style.opacity = Math.random();
      particles.appendChild(p);
    }

    let ITEMS = [], cart = {}, curCat = 'Все';

    async function loadProducts() {
      try {
        const r = await fetch('products.json?t=' + Date.now());
        ITEMS = await r.json();
      } catch(e) { ITEMS = []; }
      renderChips(); renderList(); renderNav();
    }

    function catsList() { return ['Все', ...new Set(ITEMS.map(i => i.cat))]; }

    function renderChips() {
      document.getElementById('chips').innerHTML = catsList().map(c =>
        `<div class="chip ${c === curCat ? 'on' : ''}" onclick="setCat('${c.replace(/'/g,"\\'")}')">${c}</div>`
      ).join('');
    }
    function setCat(c) { curCat = c; renderChips(); renderList(); }

    function renderList() {
      const list = ITEMS.filter(i => curCat === 'Все' || i.cat === i.cat);
      document.getElementById('list').innerHTML = list.length ? list.map(i => {
