<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Libirny Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#07070c; --glass:rgba(24,24,34,.72); --glass2:rgba(14,14,22,.9);
  --accent:#00e676; --text:#f5f5fa; --muted:#9aa0ad; --border:rgba(255,255,255,.09);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(600px 400px at 20% 0%,rgba(0,230,118,.14),transparent 60%),
             radial-gradient(700px 500px at 90% 100%,rgba(0,180,255,.12),transparent 60%);
  animation:glow 10s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.7}to{opacity:1}}
.top{position:sticky;top:0;z-index:10;padding:18px 16px 12px;background:var(--glass2);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
.top h1{font-size:20px;font-weight:800;letter-spacing:.5px}
.top h1 em{color:var(--accent);font-style:normal;text-shadow:0 0 12px rgba(0,230,118,.5)}
.sub{color:var(--muted);font-size:12px;margin-top:3px}
.warn{margin:12px 16px;padding:10px 14px;border-radius:14px;background:rgba(60,26,26,.9);
  border:1px solid rgba(120,50,50,.6);color:#ffb4b4;font-size:13px;display:none}
.chips{display:flex;gap:8px;padding:12px 16px 4px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:9px 16px;border-radius:20px;font-size:13px;white-space:nowrap;cursor:pointer;
  background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted);transition:.2s}
.chip.on{background:var(--accent);color:#04150a;font-weight:700;box-shadow:0 4px 14px rgba(0,230,118,.35)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:12px 16px 96px}
.pcard{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:18px;overflow:hidden;transition:transform .2s}
.pcard:active{transform:scale(.97)}
.pimg{height:130px;background:#141420}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pbody{padding:11px}
.pname{font-size:14px;font-weight:600;line-height:1.3}
.prow{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.pprice{font-weight:700;font-size:15px;color:var(--accent)}
.add{width:32px;height:32px;border:none;border-radius:11px;background:rgba(0,230,118,.15);
  color:var(--accent);font-size:17px;font-weight:700;cursor:pointer}
.add:active{background:var(--accent);color:#04150a}
.cnt{position:absolute;top:8px;left:8px;background:var(--accent);color:#04150a;font-size:11px;
  font-weight:700;min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;padding:0 6px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;z-index:10;background:var(--glass2);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--border)}
.nav div{flex:1;text-align:center;padding:12px 0 16px;color:var(--muted);font-size:12px;cursor:pointer;position:relative}
.nav .ic{font-size:20px;display:block;margin-bottom:3px}
.nav div.on{color:var(--accent)}
.badge{position:absolute;top:2px;left:calc(50% + 8px);background:#ff3b30;color:#fff;font-size:10px;
  font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.wrap{padding:16px 16px 110px}
.crow{display:flex;align-items:center;gap:12px;background:var(--glass);border:1px solid var(--border);
  border-radius:16px;padding:12px;margin-bottom:10px}
.crow img{width:48px;height:48px;border-radius:12px;object-fit:cover}
.crow .m{flex:1;min-width:0}
.crow .m b{font-size:14px;display:block}
.crow .m small{color:var(--muted)}
.step{display:flex;align-items:center;gap:8px}
.step button{width:30px;height:30px;border-radius:10px;border:none;background:rgba(255,255,255,.08);
  color:var(--text);font-size:17px;cursor:pointer}
input,select{width:100%;padding:14px;margin-bottom:10px;border-radius:14px;border:1px solid var(--border);
  background:rgba(0,0,0,.35);color:var(--text);font-size:15px;outline:none}
input:focus{border-color:var(--accent)}
.sumbox{padding:16px;background:var(--glass);border:1px solid var(--border);border-radius:16px;margin-top:14px}
.r{display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px;color:var(--muted)}
.r.total b{color:var(--accent);font-size:18px}
.cta{width:100%;padding:16px;border:none;border-radius:16px;font-weight:700;font-size:16px;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),#00c2ff);color:#04150a;box-shadow:0 8px 24px rgba(0,230,118,.3)}
.ghost{text-align:center;padding:50px 0;font-size:14px;color:var(--muted)}
.ghost .big{font-size:40px;display:block;margin-bottom:10px}
h2{font-size:17px;margin:18px 0 12px}
</style>
</head>
<body>
<div class="bg"></div>

<div class="page" id="page-cat">
  <div class="top">
    <h1>LIBIRNY <em>SHOP</em></h1>
    <div class="sub">18+ · Заказы через бота</div>
  </div>
  <div class="warn" id="warn">⚠️ Открой магазин через кнопку бота, иначе заказ не отправится.</div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="list"></div>
</div>

<div class="page" id="page-cart" style="display:none">
  <div class="top"><h1>🛒 Корзина</h1></div>
  <div class="wrap" id="cart-body"></div>
</div>

<div class="nav">
  <div class="on" id="nav-cat" onclick="go('cat')"><span class="ic">🏠</span>Каталог</div>
  <div id="nav-cart" onclick="go('cart')"><span class="ic">🛒</span>Корзина<span class="badge" id="badge" style="display:none">0</span></div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (!tg) { document.getElementById('warn').style.display = 'block'; }
else { tg.ready(); tg.expand(); }

let ITEMS = [], cart = {}, curCat = 'Все';

async function loadProducts(){
  try{
    const r = await fetch('products.json?t=' + Date.now());
    ITEMS = await r.json();
    if(!Array.isArray(ITEMS)) ITEMS = [];
  }catch(e){ ITEMS = []; }
  renderChips(); renderList();
}

function renderChips(){
  const cats = ['Все', ...new Set(ITEMS.map(i=>i.cat).filter(Boolean))];
  document.getElementById('chips').innerHTML = cats.map(c =>
    `<div class="chip ${c===curCat?'on':''}" onclick="setCat('${c.replace(/'/g,"\\'")}')">${c}</div>`).join('');
}
function setCat(c){ curCat = c; renderChips(); renderList(); }

function renderList(){
  const list = ITEMS.filter(i => curCat==='Все' || i.cat===curCat);
  const el = document.getElementById('list');
  if(!list.length){ el.innerHTML = '<div class="ghost" style="grid-column:1/-1"><span class="big">📭</span>Товаров пока нет</div>'; return; }
  el.innerHTML = list.map(i=>{
    const cnt = cart[i.code]||0;
    const img = i.img ? `<img src="${i.img}" alt="" loading="lazy">` : '';
    return `<div class="pcard" style="position:relative">
      ${cnt?`<div class="cnt">${cnt}</div>`:''}
      <div class="pimg">${img}</div>
      <div class="pbody">
        <div class="pname">${i.name}</div>
        <div class="prow">
          <div class="pprice">${i.price} ₽</div>
          <button class="add" onclick="addToCart('${i.code}')">+</button>
        </div>
      </div></div>`;
  }).join('');
}

function addToCart(code){
  cart[code] = (cart[code]||0) + 1;
  renderList(); renderNav();
}
function changeQty(code, d){
  cart[code] = (cart[code]||0) + d;
  if(cart[code] <= 0) delete cart[code];
  renderCart(); renderNav(); renderList();
}

function renderNav(){
  const n = Object.values(cart).reduce((a,b)=>a+b,0);
  const b = document.getElementById('badge');
  b.textContent = n; b.style.display = n ? 'flex' : 'none';
}

function go(p){
  document.getElementById('page-cat').style.display = p==='cat'?'block':'none';
  document.getElementById('page-cart').style.display = p==='cart'?'block':'none';
  document.getElementById('nav-cat').className = p==='cat'?'on':'';
  document.getElementById('nav-cart').className = p==='cart'?'on':'';
  if(p==='cart') renderCart();
}

function renderCart(){
  const el = document.getElementById('cart-body');
  const codes = Object.keys(cart);
  if(!codes.length){
    el.innerHTML = '<div class="ghost"><span class="big">🛒</span>Корзина пуста</div>';
    return;
  }
  let total = 0;
  const rows = codes.map(code=>{
    const i = ITEMS.find(x=>x.code===code);
    if(!i) return '';
    total += i.price * cart[code];
    return `<div class="crow">
      <img src="${i.img||''}" alt="">
      <div class="m"><b>${i.name}</b><small>${i.price} ₽ × ${cart[code]}</small></div>
      <div class="step">
        <button onclick="changeQty('${code}',-1)">−</button>
        <b>${cart[code]}</b>
        <button onclick="changeQty('${code}',1)">+</button>
      </div></div>`;
  }).join('');
  el.innerHTML = rows +
    `<h2>Контакты для заказа</h2>
    <input id="f-name" placeholder="Твоё имя">
    <input id="f-phone" placeholder="Телефон или @username">
    <div class="sumbox">
      <div class="r"><span>Товаров:</span><b>${codes.reduce((a,c)=>a+cart[c],0)}</b></div>
      <div class="r total"><span>Итого:</span><b>${total} ₽</b></div>
      <button class="cta" onclick="submitOrder()">Оформить заказ</button>
    </div>`;
}

function submitOrder(){
  if(!tg || !tg.sendData){
    alert('Открой магазин через кнопку бота в Telegram — тогда заказ отправится.');
    return;
  }
  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  if(!name || !phone){ alert('Заполни имя и контакт 🙂'); return; }
  const items = Object.keys(cart).map(code=>{
    const i = ITEMS.find(x=>x.code===code);
    return { code, name:i.name, price:i.price, qty:cart[code] };
  });
  const total = items.reduce((a,x)=>a+x.price*x.qty,0);
  tg.sendData(JSON.stringify({ type:'order', name, phone, items, total }));
}

loadProducts();
</script>
</body>
</html>
